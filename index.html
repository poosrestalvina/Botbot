<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Amelie">
    <title>Amelie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone">
        <!-- iOS системный статус-бар -->
        <div class="status-bar" aria-hidden="true">
            <div class="status-time" id="statusTime">9:41</div>
            <div class="status-icons">
                <svg class="ic-signal" viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="4" y="6" width="3" height="6" rx="0.5"/><rect x="8" y="3" width="3" height="9" rx="0.5"/><rect x="12" y="0" width="3" height="12" rx="0.5"/></svg>
                <svg class="ic-wifi" viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 11.5a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zM4.4 8.2a5 5 0 0 1 7.2 0l-1 1a3.6 3.6 0 0 0-5.2 0zM1.5 5.3a9 9 0 0 1 13 0l-1 1a7.6 7.6 0 0 0-11 0z"/></svg>
                <div class="ic-battery"><span class="ic-battery-level"></span></div>
            </div>
        </div>

        <!-- iOS Telegram навигация -->
        <header class="nav-bar">
            <button class="nav-back" type="button" aria-label="Назад">
                <svg viewBox="0 0 13 22" width="13" height="22" fill="none" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="11,2 2,11 11,20"/>
                </svg>
                <span class="nav-back-label">Чаты</span>
                <span class="nav-badge">12</span>
            </button>

            <div class="nav-center">
                <div class="nav-name">Amelie<span class="nav-city" id="navCity"></span></div>
                <div class="nav-status" id="chatStatus">была недавно</div>
            </div>

            <div class="nav-avatar-wrap">
                <!-- Замени содержимое .nav-avatar на <img src="amelie.jpg" alt="Amelie"> со своей картинкой -->
                <div class="nav-avatar" aria-hidden="true">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <defs>
                            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#ffd1dc"/>
                                <stop offset="100%" stop-color="#ff7eb3"/>
                            </linearGradient>
                            <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#8b4a1f"/>
                                <stop offset="100%" stop-color="#5a2d10"/>
                            </linearGradient>
                        </defs>
                        <rect width="100" height="100" fill="url(#bg)"/>
                        <path d="M15 60 Q12 25 50 18 Q88 25 85 60 L88 90 Q75 78 65 82 L60 95 L40 95 L35 82 Q25 78 12 90 Z" fill="url(#hairGrad)"/>
                        <ellipse cx="50" cy="58" rx="19" ry="22" fill="#ffd9b8"/>
                        <rect x="44" y="76" width="12" height="8" fill="#f0c4a0"/>
                        <ellipse cx="38" cy="64" rx="4" ry="3" fill="#ff9a9a" opacity="0.55"/>
                        <ellipse cx="62" cy="64" rx="4" ry="3" fill="#ff9a9a" opacity="0.55"/>
                        <ellipse cx="42" cy="56" rx="2.2" ry="2.8" fill="#3a2410"/>
                        <ellipse cx="58" cy="56" rx="2.2" ry="2.8" fill="#3a2410"/>
                        <circle cx="42.6" cy="55" r="0.9" fill="#fff"/>
                        <circle cx="58.6" cy="55" r="0.9" fill="#fff"/>
                        <path d="M39 53 L40 51 M44 52.5 L44.5 50.5 M55.5 52.5 L55 50.5 M61 53 L60 51" stroke="#3a2410" stroke-width="0.8" stroke-linecap="round"/>
                        <path d="M38 50 Q42 47.5 46 50" stroke="#5a2d10" stroke-width="1.3" fill="none" stroke-linecap="round"/>
                        <path d="M54 50 Q58 47.5 62 50" stroke="#5a2d10" stroke-width="1.3" fill="none" stroke-linecap="round"/>
                        <path d="M50 60 Q49 64 51 65" stroke="#e8b896" stroke-width="0.8" fill="none" stroke-linecap="round"/>
                        <path d="M44 69 Q47 67 50 68 Q53 67 56 69 Q53 72 50 71 Q47 72 44 69 Z" fill="#e63973"/>
                        <path d="M30 48 Q40 32 50 38 Q60 32 70 48 Q60 40 52 44 Q44 40 30 48 Z" fill="url(#hairGrad)"/>
                        <path d="M35 35 Q40 30 45 33" stroke="#a86840" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
                        <circle cx="32" cy="68" r="1.2" fill="#ffd700"/>
                        <circle cx="68" cy="68" r="1.2" fill="#ffd700"/>
                    </svg>
                </div>
                <span class="nav-online-dot" aria-hidden="true"></span>
            </div>
        </header>

        <!-- Социальное доказательство -->
        <div class="social-proof" aria-live="polite">
            <span class="sp-dot"></span>
            <span><b id="onlineCount">247</b> девушек онлайн рядом с тобой</span>
        </div>

        <!-- Тело чата -->
        <main class="chat-body" id="chatBody">
            <div class="day-divider"><span>сегодня</span></div>
        </main>

        <!-- Таймер срочности + кнопки -->
        <div class="actions" id="actions" hidden>
            <div class="urgency" id="urgency">
                <span class="urg-icon">⏰</span>
                <span>Amelie ждёт ответа: <b id="timer">04:59</b></span>
            </div>
            <a href="https://skrotrack.com/click" class="btn btn-primary" data-choice="yes">
                <span class="hearts" aria-hidden="true">
                    <span class="heart">❤️</span>
                    <span class="heart">💕</span>
                    <span class="heart">💖</span>
                    <span class="heart">❤️</span>
                    <span class="heart">💗</span>
                </span>
                <span class="btn-label">💖 Я не против</span>
            </a>
            <a href="https://skrotrack.com/click" class="btn btn-secondary" data-choice="no">
                <span class="btn-label">Нет, я занят</span>
            </a>
        </div>

        <!-- Контейнер для салюта эмодзи -->
        <div class="emoji-burst" id="emojiBurst" aria-hidden="true"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
