<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#5288c1">
    <meta name="description" content="Новое сообщение от Amelie">
    <title>Amelie — В сети</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Push-уведомление при заходе -->
    <div class="push-notification" id="pushNotif" hidden>
        <div class="push-avatar">
            <svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">
                <rect width="100" height="100" fill="url(#pushBg)"/>
                <defs>
                    <linearGradient id="pushBg" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ffb6c1"/>
                        <stop offset="100%" stop-color="#ff6b9d"/>
                    </linearGradient>
                </defs>
                <text x="50" y="62" text-anchor="middle" font-size="42" font-family="sans-serif" font-weight="700" fill="#fff">A</text>
            </svg>
        </div>
        <div class="push-text">
            <div class="push-title">Amelie</div>
            <div class="push-msg">Новое сообщение...</div>
        </div>
        <div class="push-time">сейчас</div>
    </div>

    <div class="phone">
        <!-- Шапка чата -->
        <header class="chat-header">
            <button class="back-btn" type="button" aria-label="Назад">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>

            <div class="avatar-wrap">
                <!-- Замени содержимое .avatar на <img src="amelie.jpg" alt="Amelie"> со своей картинкой -->
                <div class="avatar" aria-hidden="true">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <defs>
                            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#ffd1dc"/>
                                <stop offset="100%" stop-color="#ff7eb3"/>
                            </linearGradient>
                            <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#8b4a1f"/>
                                <stop offset="100%" stop-color="#5a2d10"/>
                            </linearGradient>
                        </defs>
                        <rect width="100" height="100" fill="url(#bg)"/>
                        <!-- волосы сзади (длинные, с локонами) -->
                        <path d="M15 60 Q12 25 50 18 Q88 25 85 60 L88 90 Q75 78 65 82 L60 95 L40 95 L35 82 Q25 78 12 90 Z" fill="url(#hairGrad)"/>
                        <!-- лицо -->
                        <ellipse cx="50" cy="58" rx="19" ry="22" fill="#ffd9b8"/>
                        <!-- шея -->
                        <rect x="44" y="76" width="12" height="8" fill="#f0c4a0"/>
                        <!-- щёчки (румянец) -->
                        <ellipse cx="38" cy="64" rx="4" ry="3" fill="#ff9a9a" opacity="0.55"/>
                        <ellipse cx="62" cy="64" rx="4" ry="3" fill="#ff9a9a" opacity="0.55"/>
                        <!-- глаза -->
                        <ellipse cx="42" cy="56" rx="2.2" ry="2.8" fill="#3a2410"/>
                        <ellipse cx="58" cy="56" rx="2.2" ry="2.8" fill="#3a2410"/>
                        <circle cx="42.6" cy="55" r="0.9" fill="#fff"/>
                        <circle cx="58.6" cy="55" r="0.9" fill="#fff"/>
                        <!-- ресницы -->
                        <path d="M39 53 L40 51 M44 52.5 L44.5 50.5 M55.5 52.5 L55 50.5 M61 53 L60 51" stroke="#3a2410" stroke-width="0.8" stroke-linecap="round"/>
                        <!-- брови (тонкие, дугой) -->
                        <path d="M38 50 Q42 47.5 46 50" stroke="#5a2d10" stroke-width="1.3" fill="none" stroke-linecap="round"/>
                        <path d="M54 50 Q58 47.5 62 50" stroke="#5a2d10" stroke-width="1.3" fill="none" stroke-linecap="round"/>
                        <!-- нос -->
                        <path d="M50 60 Q49 64 51 65" stroke="#e8b896" stroke-width="0.8" fill="none" stroke-linecap="round"/>
                        <!-- губы (полные, розовые) -->
                        <path d="M44 69 Q47 67 50 68 Q53 67 56 69 Q53 72 50 71 Q47 72 44 69 Z" fill="#e63973"/>
                        <path d="M46 69 Q50 70.5 54 69" stroke="#c42858" stroke-width="0.5" fill="none"/>
                        <!-- чёлка -->
                        <path d="M30 48 Q40 32 50 38 Q60 32 70 48 Q60 40 52 44 Q44 40 30 48 Z" fill="url(#hairGrad)"/>
                        <!-- блик на волосах -->
                        <path d="M35 35 Q40 30 45 33" stroke="#a86840" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
                        <!-- серёжка -->
                        <circle cx="32" cy="68" r="1.2" fill="#ffd700"/>
                        <circle cx="68" cy="68" r="1.2" fill="#ffd700"/>
                    </svg>
                </div>
                <span class="online-dot" aria-hidden="true"></span>
            </div>

            <div class="chat-info">
                <div class="chat-name">Amelie</div>
                <div class="chat-status" id="chatStatus">в сети</div>
            </div>

            <div class="header-actions" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                    <circle cx="12" cy="5" r="2"/>
                    <circle cx="12" cy="12" r="2"/>
                    <circle cx="12" cy="19" r="2"/>
                </svg>
            </div>
        </header>

        <!-- Тело чата -->
        <main class="chat-body" id="chatBody">
            <div class="day-divider"><span>Сегодня</span></div>
            <!-- Сообщения и индикатор печати добавляются скриптом -->
        </main>

        <!-- Кнопки выбора -->
        <div class="actions" id="actions" hidden>
            <a href="[ТВОЯ_ССЫЛКА]" class="btn btn-primary" data-choice="yes">
                <span class="hearts" aria-hidden="true">
                    <span class="heart">❤️</span>
                    <span class="heart">💕</span>
                    <span class="heart">💖</span>
                    <span class="heart">❤️</span>
                    <span class="heart">💗</span>
                </span>
                <span class="btn-label">💖 Я не против</span>
            </a>
            <a href="[ТВОЯ_ССЫЛКА]" class="btn btn-secondary" data-choice="no">
                Нет, я занят
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
