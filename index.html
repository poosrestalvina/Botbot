<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a0033">
    <meta name="description" content="Mystery Box — открой коробку и забери приз!">
    <title>Mystery Box — Открой свой приз!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars" id="stars"></div>

    <main class="container">
        <header class="header">
            <div class="logo">🎁</div>
            <h1>Mystery Box</h1>
            <p class="subtitle">У тебя <b>3 попытки</b>, чтобы найти приз!<br>Выбери коробку и испытай удачу</p>
        </header>

        <div class="attempts">
            <span class="attempts-icon">🎯</span>
            <span>Попыток осталось:</span>
            <span class="attempts-count" id="attemptsCount">3</span>
        </div>

        <div class="boxes-grid" id="boxesGrid">
            <button class="box" data-index="0" type="button" aria-label="Открыть коробку 1">
                <span class="box-bow">🎀</span>
                <span class="box-icon">📦</span>
            </button>
            <button class="box" data-index="1" type="button" aria-label="Открыть коробку 2">
                <span class="box-bow">🎀</span>
                <span class="box-icon">📦</span>
            </button>
            <button class="box" data-index="2" type="button" aria-label="Открыть коробку 3">
                <span class="box-bow">🎀</span>
                <span class="box-icon">📦</span>
            </button>
        </div>

        <div class="message" id="message" aria-live="polite"></div>
        <p class="hint">👆 Нажми на коробку, чтобы открыть</p>
    </main>

    <div class="win-screen" id="winScreen" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="win-content">
            <div class="win-emoji">🎉</div>
            <div class="win-title">Поздравляем!</div>
            <p class="win-text">
                Ты нашёл приз!<br>
                Забери его прямо сейчас, пока он не достался другому.
            </p>
            <a href="[твоя_ссылка]" class="claim-btn" id="claimBtn" rel="noopener">
                🎁 Забрать приз
            </a>
            <div class="timer">
                Приз сгорит через: <span class="timer-count" id="timer">05:00</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
