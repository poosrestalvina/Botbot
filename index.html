<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#5288c1">
    <meta name="description" content="Новое сообщение от Amelie">
    <title>Amelie — В сети</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone">
        <!-- Шапка чата -->
        <header class="chat-header">
            <button class="back-btn" type="button" aria-label="Назад">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>

            <div class="avatar-wrap">
                <!-- Замени содержимое .avatar на <img src="..."> со своей картинкой -->
                <div class="avatar" aria-hidden="true">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <defs>
                            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#ffb6c1"/>
                                <stop offset="100%" stop-color="#ff6b9d"/>
                            </linearGradient>
                        </defs>
                        <rect width="100" height="100" fill="url(#bg)"/>
                        <!-- волосы сзади -->
                        <path d="M20 55 Q18 25 50 22 Q82 25 80 55 L82 80 Q70 70 50 70 Q30 70 18 80 Z" fill="#6b3410"/>
                        <!-- лицо -->
                        <ellipse cx="50" cy="58" rx="20" ry="22" fill="#ffd9b8"/>
                        <!-- щёки -->
                        <circle cx="40" cy="63" r="3" fill="#ff9a9a" opacity="0.6"/>
                        <circle cx="60" cy="63" r="3" fill="#ff9a9a" opacity="0.6"/>
                        <!-- глаза -->
                        <ellipse cx="43" cy="55" rx="2" ry="2.5" fill="#3a2410"/>
                        <ellipse cx="57" cy="55" rx="2" ry="2.5" fill="#3a2410"/>
                        <circle cx="43.5" cy="54" r="0.7" fill="#fff"/>
                        <circle cx="57.5" cy="54" r="0.7" fill="#fff"/>
                        <!-- брови -->
                        <path d="M40 50 Q43 48 46 50" stroke="#3a2410" stroke-width="1.2" fill="none" stroke-linecap="round"/>
                        <path d="M54 50 Q57 48 60 50" stroke="#3a2410" stroke-width="1.2" fill="none" stroke-linecap="round"/>
                        <!-- губы -->
                        <path d="M45 67 Q50 70 55 67" stroke="#d6336c" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <!-- чёлка -->
                        <path d="M28 45 Q40 30 50 35 Q60 30 72 45 Q60 38 50 42 Q40 38 28 45 Z" fill="#6b3410"/>
                    </svg>
                </div>
                <span class="online-dot" aria-hidden="true"></span>
            </div>

            <div class="chat-info">
                <div class="chat-name">Amelie</div>
                <div class="chat-status" id="chatStatus">в сети</div>
            </div>

            <div class="header-actions" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                    <circle cx="12" cy="5" r="2"/>
                    <circle cx="12" cy="12" r="2"/>
                    <circle cx="12" cy="19" r="2"/>
                </svg>
            </div>
        </header>

        <!-- Тело чата -->
        <main class="chat-body" id="chatBody">
            <div class="day-divider"><span>Сегодня</span></div>
            <!-- Сообщения и индикатор печати добавляются скриптом -->
        </main>

        <!-- Кнопки выбора -->
        <div class="actions" id="actions" hidden>
            <a href="[ТВОЯ_ССЫЛКА]" class="btn btn-primary" data-choice="yes">
                💖 Я не против
            </a>
            <a href="[ТВОЯ_ССЫЛКА]" class="btn btn-secondary" data-choice="no">
                Нет, я занят
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
